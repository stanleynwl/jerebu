<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jerebu — Malaysia &amp; Singapore haze, in cigarettes</title>
  <meta name="description" content="How many cigarettes is breathing the air today? Live Malaysia (DOE) and Singapore (NEA) readings, converted into cigarettes a day.">
  <meta property="og:title" content="Jerebu — Malaysia's haze, in cigarettes">
  <meta property="og:description" content="Live DOE API readings for every state, converted into cigarettes a day.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0c1330">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <main class="wrap">
    <div class="stage" id="stage">
      <div class="loc" id="loc" aria-live="polite"><b id="locCity"></b><span id="locNote"></span></div>
      <span class="srcbadge" id="srcBadge" hidden></span>
      <button type="button" class="pausebtn" id="pausebtn" aria-pressed="false" aria-label="Pause animation" title="Pause / play animation">
        <svg class="i-pause" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" rx="1" fill="currentColor"/></svg>
        <svg class="i-play" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>
      </button>
      <button type="button" class="mapbtn" id="mapbtn" aria-pressed="false" title="Hold to show the haze map (or hold M). Tap to pin it.">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.5v13.5L9 17.5l6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
        <span data-i18n="hold">Hold</span>
      </button>
    </div>

    <section class="panel">
      <header class="top">
        <div class="brand">Jerebu<span>.my</span></div>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button><button type="button" data-lang="ms">BM</button>
        </div>
      </header>

      <div class="hero">
        <p class="title" role="heading" aria-level="2" data-i18n="title">Breathing this air for 24hrs ≈</p>
        <h1 class="big" aria-live="polite"><span class="num" id="num">–</span><span class="unit" id="unit">cigarettes</span></h1>
        <p class="cap" data-i18n="cap">worth of harm to your health</p>
      </div>

      <fieldset class="seg seg-state">
        <legend data-i18n="stateLegend">State</legend>
        <div class="chips" id="stateChips"></div>
      </fieldset>

      <fieldset class="seg seg-city" id="cities">
        <legend data-i18n="cityLegend">City</legend>
        <div class="chips" id="cityChips"></div>
      </fieldset>

      <fieldset class="seg seg-brand">
        <legend data-i18n="brandLegend">Brand</legend>
        <div class="chips" id="brandChips"></div>
      </fieldset>

      <div class="stats">
        <div><b id="sApi">–</b><span class="bandlbl" id="sBand"></span><small id="lblApi">API now</small></div>
        <div><b id="sPm">–</b><small id="lblPm">PM2.5 est., µg/m³</small></div>
        <div><b id="sWorst">–</b><small id="sWorstName"></small></div>
      </div>

      <div class="trend" id="trend" hidden>
        <div class="trend-h"><span data-i18n="trend">Last 24 hours</span><span id="trendRange"></span></div>
        <svg id="spark" viewBox="0 0 320 64" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="trend-x"><span>−24h</span><span data-i18n="now">now</span></div>
      </div>

      <div class="upd">
        <span class="dot" id="dot"></span>
        <span id="updated">…</span>
        <span class="grow"></span>
        <button type="button" class="ghost" id="locate">📍 <span data-i18n="locate">Near me</span></button>
        <button type="button" class="iconbtn" id="refresh" aria-label="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>

      <div class="sim">
        <div class="sim-h"><span data-i18n="simulate">Simulate results</span><b id="simLabel"></b></div>
        <div class="sim-row">
          <input type="range" id="sim" min="0" max="500" step="1" value="50" aria-label="Simulated API">
          <button type="button" id="reset" data-i18n="reset">Reset</button>
        </div>
        <div class="sim-scale" aria-hidden="true"><span>0</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span></div>
      </div>

      <div class="rank">
        <h2 data-i18n="smokiest">Smokiest right now</h2>
        <ol id="rank"></ol>
      </div>

      <p class="foot" data-i18n-html="foot"></p>
    </section>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
